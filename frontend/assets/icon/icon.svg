    <path d="M46 70.5 C49 67.5 59 67.5 62 70.5 C58 69.5 50 69.5 46 70.5 Z" fill="#1d1a1a"/>
    <ellipse cx="54" cy="74" rx="4.2" ry="1.7" fill="#c98b78"/>
