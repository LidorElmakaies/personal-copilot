    <rect x="37.5" y="51" width="14" height="10" rx="2.5" fill="url(#lens)" stroke="#0b0e13" stroke-width="2.2"/>
    <rect x="56.5" y="51" width="14" height="10" rx="2.5" fill="url(#lens)" stroke="#0b0e13" stroke-width="2.2"/>
    <path d="M51.5 55 L56.5 55" stroke="#0b0e13" stroke-width="2.2"/>
    <path d="M40 53.5 L44 53.5 M59 53.5 L63 53.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
    <path d="M31.5 58 C29 30 79 30 76.5 58" fill="none" stroke="#4fe3ff" stroke-width="3" stroke-linecap="round"/>
