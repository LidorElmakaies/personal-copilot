<!-- App icon source. 108x108 = Android's adaptive-icon canvas: launchers show the middle 72x72 and
     mask it (circle, squircle…); everything that matters sits inside the 66px safe circle.
     Two layers, rendered separately for Android: #background and #foreground.
     Regenerate the PNGs with `node devops/icons/render.js` after editing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#090b10"/></linearGradient>
    <radialGradient id="cyanGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4fe3ff" stop-opacity=".38"/><stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8f7ff"/><stop offset="1" stop-color="#2fc4e6"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cdb8"/><stop offset="1" stop-color="#dfa98f"/></linearGradient>
  </defs>
  <g id="background">
    <rect width="108" height="108" fill="url(#night)"/>
    <circle cx="54" cy="56" r="36" fill="url(#cyanGlow)"/>
  </g>
  <g id="foreground" transform="translate(54 53) scale(.9) translate(-54 -54)">
    <path d="M54 89 L44 84 L44 94 Z M54 89 L64 84 L64 94 Z" fill="#7a1f35"/>
    <rect x="51.5" y="86.5" width="5" height="5" rx="1.5" fill="#5c1527"/>
    <ellipse cx="34" cy="60" rx="4" ry="6" fill="url(#skin)"/>
    <ellipse cx="74" cy="60" rx="4" ry="6" fill="url(#skin)"/>
    <path d="M35 52 C35 40 44 35 54 35 C64 35 73 40 73 52 L73 64 C73 77 64 84 54 84 C44 84 35 77 35 64 Z" fill="url(#skin)"/>
