# Deletes the reminder add-reminder.yaml added (TITLE, today) from the Calendar tab. By testID
# (`id:`) and the row's "TITLE, time" label: the same in English and Hebrew.
appId: com.lidor.personalcopilot
---
- launchApp:
    permissions: {}
# A tab tap is sometimes missed while the app settles: again until the Calendar shows.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-calendar"
          waitToSettleTimeoutMs: 1500
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "add-reminder"
          timeout: 5000
- tapOn:
    text: "${TITLE}, .*"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
- tapOn:
    id: "reminder-delete"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
# The confirmation's own Delete.
- tapOn:
    id: "reminder-delete-confirm"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: "${TITLE}, .*"
    timeout: 10000
