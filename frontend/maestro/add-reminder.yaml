# Adds a one-time reminder TITLE today at TIME ("HH:MM") from the Calendar tab's +; smoke.js
# works out the taps below from TIME. By testID (`id:`): the same in English and Hebrew.
appId: com.lidor.personalcopilot
---
# A tab tap is sometimes missed while the app settles: again until the Calendar shows.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-calendar"
          waitToSettleTimeoutMs: 1500
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: "add-reminder"
          timeout: 5000
- tapOn:
    id: "add-reminder"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
# From the form's 19:00: HOUR_TAPS of HOUR_BUTTON (hours-more / hours-fewer), MINUTE_TAPS of
# minutes-more (5 minutes each). A step changes only a number: a short settle.
- repeat:
    times: ${HOUR_TAPS}
    commands:
      - tapOn:
          id: ${HOUR_BUTTON}
          waitToSettleTimeoutMs: 300
          retryTapIfNoChange: false
- repeat:
    times: ${MINUTE_TAPS}
    commands:
      - tapOn:
          id: "minutes-more"
          waitToSettleTimeoutMs: 300
          retryTapIfNoChange: false
# The form's summary ends with the time set, in both languages ("Once, on Fri 23 Oct 2026, 11:45").
- assertVisible:
    id: "reminder-summary"
    text: ".*${TIME}"
# The title last, closed with Enter: Back (hideKeyboard) would close the sheet.
- tapOn:
    id: "reminder-title"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
- inputText: ${TITLE}
- pressKey: Enter
- takeScreenshot: reminder-form
- tapOn:
    id: "reminder-save"
    waitToSettleTimeoutMs: 1500
    retryTapIfNoChange: false
# The day's row reads "TITLE, TIME" in both languages (its TalkBack label).
- extendedWaitUntil:
    visible: "${TITLE}, ${TIME}"
    timeout: 10000
- takeScreenshot: reminder-added
