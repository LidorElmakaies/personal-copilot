global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Without this, the scraped sample's own `job` label collides with this job_name and gets
    # silently renamed to `exported_job` — every query written as job="gateway" then matches nothing.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
