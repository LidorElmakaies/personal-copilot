services:
  frontend:
    extends:
      file: ../common.yml
      service: _defaults
    # See frontend/Dockerfile.
    build:
      context: ../../frontend
      args:
        # Build arg, not a runtime env var — see docs/specs/architecture.md#compose--build-layout.
        - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8081:80"
    networks:
      - personal-copilot
