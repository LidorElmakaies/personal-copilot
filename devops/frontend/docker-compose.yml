services:
  frontend:
    extends:
      file: ../common.yml
      service: _defaults
    # See frontend/Dockerfile.
    build:
      context: ../../frontend
      # Just the version folder, for the app's version info (not the whole repo).
      additional_contexts:
        version: ../../version
      args:
        # Build arg, not a runtime env var — see docs/specs/architecture.md#compose--build-layout.
        - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8081:80"
    # The APK registry (devops/android/publish-apk.sh writes it), served at /apk/. Outside the
    # image so published APKs survive frontend rebuilds.
    volumes:
      - ../data/apk:/apk:ro
    networks:
      - personal-copilot
