services:
  calendar:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/calendar/Dockerfile
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=calendar
    # No ports: — internal-only, never published to the host (see
    # .claude/memory/feedback_gateway_only_service_access.md).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - personal-copilot
      - observability
