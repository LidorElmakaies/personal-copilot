services:
  auth:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/auth/Dockerfile
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=auth
    # No ports: — internal-only, never published to the host (see
    # .claude/memory/feedback_gateway_only_service_access.md).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personal-copilot
      - observability
