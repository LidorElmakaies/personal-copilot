# Shared service defaults, applied per-service via `extends:` — see
# docs/specs/architecture.md#compose--build-layout for why (and why `networks:` isn't here).
# Never listed in the root docker-compose.yml's `include:`, so it never runs as its own container.
services:
  _defaults:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../backend/.env
