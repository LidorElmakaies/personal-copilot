services:
  postgres:
    extends:
      file: ../common.yml
      service: _defaults
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shabbat_notifier
    # Not published to the host — only Auth Service (the one table-owning service so far) talks
    # to it, and that's internal-only per the gateway-only-access rule.
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - shabbat-notifier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
