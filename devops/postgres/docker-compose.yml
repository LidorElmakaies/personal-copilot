services:
  postgres:
    extends:
      file: ../common.yml
      service: _defaults
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=personal_copilot
    # Not published to the host — only internal services talk to it, per the gateway-only-access rule.
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - personal-copilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot, idempotent: creates each service's schema in personal_copilot if missing. Runs on
  # every `up` — the data dir already exists, so Postgres's own first-boot init scripts never would.
  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=personal_copilot
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE SCHEMA IF NOT EXISTS users;
        CREATE SCHEMA IF NOT EXISTS reminders;
        CREATE SCHEMA IF NOT EXISTS notifications;
        SQL
    restart: "no"
    networks:
      - personal-copilot
