services:
  gateway:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/gateway/Dockerfile
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=gateway
      - JWT_SECRET=${JWT_SECRET}
      - USERS_SERVICE_URL=http://users:8001
      - CALENDAR_SERVICE_URL=http://calendar:8002
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8004
      - REMINDERS_SERVICE_URL=http://reminders:8003
    # The only service published to the host (see
    # .claude/memory/feedback_gateway_only_service_access.md).
    ports:
      - "8000:8000"
    depends_on:
      users:
        condition: service_started
      calendar:
        condition: service_healthy
      notifications:
        condition: service_healthy
      reminders:
        condition: service_healthy
    networks:
      - personal-copilot
      - observability
