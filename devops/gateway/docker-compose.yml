services:
  gateway:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/gateway/Dockerfile
      # Just the version folder, for the image's version info (not the whole repo).
      additional_contexts:
        version: ../../version
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=gateway
      - JWT_SECRET=${JWT_SECRET}
      - USERS_SERVICE_URL=http://users:8001
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8004
      - REMINDERS_SERVICE_URL=http://reminders:8003
    # The only service published to the host (see
    # .claude/memory/feedback_gateway_only_service_access.md) — on 127.0.0.1 only: phones reach it
    # through tailscale serve, the cloud through the SSH tunnel, both local. That's what lets
    # Gateway trust X-Forwarded-For (backend/apps/gateway/src/trust-proxy.ts).
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      users:
        condition: service_healthy
      notifications:
        condition: service_healthy
      reminders:
        condition: service_healthy
    networks:
      - personal-copilot
      - observability
