# App stack (as opposed to devops/observability/docker-compose.yml, the telemetry stack).
# See docs/specs/architecture.md#compose--build-layout for the include/extends layout, and
# .claude/agents/devops.md for how to add a new service.

include:
  - path: gateway/docker-compose.yml
  - path: auth/docker-compose.yml
  - path: telegram/docker-compose.yml
  - path: frontend/docker-compose.yml
  - path: postgres/docker-compose.yml
  - path: kafka/docker-compose.yml

networks:
  personal-copilot:      # internal service-to-service traffic
    driver: bridge

  # Owned by devops/observability/docker-compose.yml, must already be running — see root
  # CLAUDE.md's "First run" for startup order.
  observability:
    external: true
    name: observability
