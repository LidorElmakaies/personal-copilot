services:
  notifications:
    extends:
      file: ../common.yml
      service: _defaults
    build:
      context: ../../backend
      dockerfile: apps/notifications/Dockerfile
      # Just the version folder, for the image's version info (not the whole repo).
      additional_contexts:
        version: ../../version
    env_file:
      - ../docker.env
    environment:
      - OTEL_SERVICE_NAME=notifications
    # No ports: — internal-only, never published to the host (see
    # .claude/memory/feedback_gateway_only_service_access.md).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8004/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      # Its tables reference users.users, so the Users Service must have created them first.
      users:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - personal-copilot
      - observability
