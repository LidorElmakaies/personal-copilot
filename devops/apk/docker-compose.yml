services:
  apk:
    extends:
      file: ../common.yml
      service: _defaults
    image: caddy:2-alpine
    # _defaults' backend/.env is the backend's; the registry reads nothing from it.
    env_file: !reset []
    # tailscale serve forwards https://<pc>.ts.net here (devops/tailscale/serve.js).
    ports:
      - "127.0.0.1:8081:80"
    # The APK registry (`node devops/android/apk.js publish` writes it), served at /apk/.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/apk:/apk:ro
